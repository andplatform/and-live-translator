[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "and-live-translator"
version = "1.0.0"
description = "Real-time broadcast speech translation, live captions, and simultaneous dubbing engine for vMix and OBS Studio."
readme = "README.md"
authors = [{ name = "Manu Gordillo / AND - END", email = "contacto@guiand.es" }]
license = { text = "MIT" }
keywords = ["vmix", "broadcast", "live-translation", "subtitles", "ndi", "speech-to-speech", "whisper"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video :: Capture"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.0",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
    "jinja2>=3.1.4",
    "groq>=0.9.0",
    "openai>=1.40.0",
    "edge-tts>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/andplatform/and-live-translator"
Documentation = "https://github.com/andplatform/and-live-translator#readme"
Repository = "https://github.com/andplatform/and-live-translator.git"
Issues = "https://github.com/andplatform/and-live-translator/issues"
