<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>vMix Live Subtitle Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 50px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .subtitle-box {
      max-width: 82%;
      background: rgba(8, 12, 22, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 6px solid #38bdf8;
      border-radius: 12px;
      padding: 16px 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      opacity: 0;
      transform: translateY(16px) scale(0.98);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .subtitle-box.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .subtitle-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .badge-live {
      background: #ef4444;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-lang {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .subtitle-text {
      color: #ffffff;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.35;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      letter-spacing: -0.01em;
    }
    .subtitle-original {
      margin-top: 6px;
      font-size: 16px;
      color: #94a3b8;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }
    .subtitle-original.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="subBox" class="subtitle-box">
    <div class="subtitle-header">
      <span class="badge-live">Live</span>
      <span id="langBadge" class="badge-lang">ESP</span>
    </div>
    <div id="subText" class="subtitle-text">Esperando señal...</div>
    <div id="subOriginal" class="subtitle-original"></div>
  </div>

  <script>
    const box = document.getElementById("subBox");
    const textEl = document.getElementById("subText");
    const origEl = document.getElementById("subOriginal");
    const langBadge = document.getElementById("langBadge");
    let hideTimeout = null;

    // Obtener parámetros de la URL (?lang=fr&dual=1)
    const urlParams = new URLSearchParams(window.location.search);
    const targetLang = urlParams.get("lang") || "es";
    const isDual = urlParams.get("dual") === "1" || urlParams.get("dual") === "true";

    langBadge.textContent = targetLang.toUpperCase();

    function connect() {
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = proto + "//" + window.location.host + "/ws?lang=" + encodeURIComponent(targetLang) + "&dual=" + (isDual ? "1" : "0");
      const ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === "translation" && data.translated) {
            textEl.textContent = data.translated;

            if (isDual && data.original) {
              origEl.textContent = data.original;
              origEl.classList.add("visible");
            } else {
              origEl.classList.remove("visible");
            }

            box.classList.add("visible");

            if (hideTimeout) clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
              box.classList.remove("visible");
            }, 5000);
          } else if (data.type === "clear") {
            box.classList.remove("visible");
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        setTimeout(connect, 2000);
      };
    }
    connect();
  </script>
</body>
</html>
