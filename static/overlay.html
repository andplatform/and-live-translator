<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AND Live Subtitle Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Caja de subtítulo ───────────────────────────────────── */
    .subtitle-box {
      max-width: 88%;
      min-width: 200px;
      background: rgba(6, 10, 20, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 10px;
      border-left: 6px solid #38bdf8;
      padding: 14px 26px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.70);

      /* Oculto por defecto – fade in/out suave */
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.28s ease, transform 0.28s ease;
      pointer-events: none;
    }
    .subtitle-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Texto principal del subtítulo ───────────────────────── */
    .subtitle-text {
      color: #ffffff;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.4;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
      letter-spacing: -0.01em;

      /* Crossfade del texto: cuando cambia, hace fade out/in */
      transition: opacity 0.18s ease;
    }
    .subtitle-text.fading {
      opacity: 0;
    }

    /* ── Texto original (modo dual) ──────────────────────────── */
    .subtitle-original {
      margin-top: 5px;
      font-size: 15px;
      color: #94a3b8;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      height: 0;
      transition: opacity 0.2s ease, height 0.2s ease;
    }
    .subtitle-original.visible {
      opacity: 1;
      height: 22px;
    }
  </style>
</head>
<body>
  <div id="subBox" class="subtitle-box">
    <div id="subText" class="subtitle-text"></div>
    <div id="subOriginal" class="subtitle-original"></div>
  </div>

  <script>
    const box     = document.getElementById("subBox");
    const textEl  = document.getElementById("subText");
    const origEl  = document.getElementById("subOriginal");

    const params     = new URLSearchParams(window.location.search);
    const targetLang = params.get("lang") || "es";
    const isDual     = params.get("dual") === "1";

    // ── Cola de subtítulos y control de cadencia ───────────────
    // Evita que el texto cambie más rápido de lo que el ojo puede leer.
    // Si llega un subtítulo nuevo antes de MIN_DISPLAY_MS, se encola
    // y se muestra cuando el anterior lleve suficiente tiempo en pantalla.

    const MIN_DISPLAY_MS = 2200;   // Mínimo que un subtítulo debe estar en pantalla
    const HIDE_AFTER_MS  = 7000;   // Si no llega nada nuevo, ocultar tras este tiempo

    let queue          = [];       // Frases pendientes de mostrar
    let isShowing      = false;    // Hay un subtítulo visible ahora mismo
    let shownAt        = 0;        // Timestamp en que se mostró el actual
    let hideTimer      = null;
    let nextTimer      = null;

    function clearTimers() {
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      if (nextTimer) { clearTimeout(nextTimer); nextTimer = null; }
    }

    // Muestra el texto directamente, con crossfade si ya hay algo visible
    function displayText(translated, original) {
      clearTimers();

      const doShow = () => {
        textEl.textContent = translated;
        if (isDual && original) {
          origEl.textContent = original;
          origEl.classList.add("visible");
        } else {
          origEl.classList.remove("visible");
        }
        textEl.classList.remove("fading");
        box.classList.add("visible");
        isShowing = true;
        shownAt   = Date.now();

        // Ocultar automáticamente si no llega nada nuevo
        hideTimer = setTimeout(() => {
          box.classList.remove("visible");
          isShowing = false;
          shownAt   = 0;
          // Procesar siguiente en cola si hubiera
          processQueue();
        }, HIDE_AFTER_MS);
      };

      if (isShowing) {
        // Ya hay texto visible → crossfade suave (fade out → cambio → fade in)
        textEl.classList.add("fading");
        setTimeout(doShow, 180);
      } else {
        doShow();
      }
    }

    // Saca el siguiente elemento de la cola respetando MIN_DISPLAY_MS
    function processQueue() {
      if (queue.length === 0) return;

      const elapsed = Date.now() - shownAt;
      const wait    = Math.max(0, MIN_DISPLAY_MS - elapsed);

      nextTimer = setTimeout(() => {
        const item = queue.shift();
        if (item) displayText(item.translated, item.original);
        // Seguir procesando si hay más en la cola
        if (queue.length > 0) processQueue();
      }, wait);
    }

    // Entrada principal: nueva traducción recibida
    function onNewSubtitle(translated, original) {
      const elapsed = Date.now() - shownAt;

      if (!isShowing || elapsed >= MIN_DISPLAY_MS) {
        // Se puede mostrar inmediatamente
        queue = [];   // Descartamos cola vieja (ya tenemos frase más reciente)
        displayText(translated, original);
      } else {
        // El actual lleva poco tiempo → encolar (solo guardamos el más reciente)
        queue = [{ translated, original }];
        // Si no hay nextTimer activo, programamos el relevo
        if (!nextTimer) processQueue();
      }
    }

    // ── WebSocket ──────────────────────────────────────────────
    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const url   = proto + "//" + location.host + "/ws?lang=" + encodeURIComponent(targetLang) + "&dual=" + (isDual ? "1" : "0");
      const ws    = new WebSocket(url);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          // Aceptamos tanto "translation" como "partial" — ambos tienen `translated`
          if ((data.type === "translation" || data.type === "partial") && data.translated) {
            onNewSubtitle(data.translated, data.original || "");
          } else if (data.type === "clear") {
            clearTimers();
            queue = [];
            box.classList.remove("visible");
            isShowing = false;
          }
        } catch (_) {}
      };

      ws.onclose = () => setTimeout(connect, 2000);
    }

    connect();
  </script>
</body>
</html>
