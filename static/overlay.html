<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AND Live Subtitle Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 44px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      gap: 8px;
    }

    /* ── Fila de subtítulo ─────────────────────────────────────── */
    .sub-row {
      max-width: 90%;
      display: flex;
      align-items: center;
      gap: 0;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .sub-row.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Fila anterior: más pequeña y semitransparente */
    .sub-row.prev {
      opacity: 0;
      transform: translateY(0);
    }
    .sub-row.prev.visible {
      opacity: 0.55;
    }

    /* Barra de color del hablante */
    .speaker-bar {
      width: 5px;
      min-height: 100%;
      border-radius: 3px 0 0 3px;
      flex-shrink: 0;
      align-self: stretch;
      background: #38bdf8;   /* se sobreescribe inline */
    }

    /* Cuerpo del subtítulo */
    .sub-body {
      background: rgba(6, 10, 20, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 0 10px 10px 0;
      padding: 12px 22px;
    }

    /* Texto principal */
    .sub-text {
      color: #ffffff;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.35;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
      transition: opacity 0.16s ease;
    }
    .sub-text.fading { opacity: 0; }

    /* Fila anterior: texto más pequeño */
    .sub-row.prev .sub-text { font-size: 20px; font-weight: 500; }

    /* Texto original en modo dual */
    .sub-original {
      margin-top: 4px;
      font-size: 14px;
      color: #94a3b8;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 520px;
    }
  </style>
</head>
<body>

  <!-- Fila anterior (hablante previo, semitransparente) -->
  <div id="prevRow" class="sub-row prev">
    <div id="prevBar" class="speaker-bar"></div>
    <div class="sub-body">
      <div id="prevText" class="sub-text"></div>
    </div>
  </div>

  <!-- Fila actual (hablante en curso) -->
  <div id="curRow" class="sub-row">
    <div id="curBar" class="speaker-bar"></div>
    <div class="sub-body">
      <div id="curText" class="sub-text"></div>
      <div id="curOriginal" class="sub-original" style="display:none"></div>
    </div>
  </div>

  <script>
    const params     = new URLSearchParams(location.search);
    const targetLang = params.get("lang") || "es";
    const isDual     = params.get("dual") === "1";

    // ── Referencias DOM ─────────────────────────────────────────
    const curRow  = document.getElementById("curRow");
    const curBar  = document.getElementById("curBar");
    const curText = document.getElementById("curText");
    const curOrig = document.getElementById("curOriginal");

    const prevRow  = document.getElementById("prevRow");
    const prevBar  = document.getElementById("prevBar");
    const prevText = document.getElementById("prevText");

    // ── Estado ──────────────────────────────────────────────────
    const MIN_DISPLAY_MS = 2200;
    const HIDE_AFTER_MS  = 7000;

    let queue       = [];
    let shownAt     = 0;
    let hideTimer   = null;
    let nextTimer   = null;
    let lastSpeaker = null;   // { id, color, text }

    function clearTimers() {
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      if (nextTimer) { clearTimeout(nextTimer); nextTimer = null; }
    }

    // Mueve la fila actual al slot "anterior" y aplica color
    function promotePrev(text, speakerId, speakerColor) {
      if (curText.textContent && lastSpeaker && lastSpeaker.id !== speakerId) {
        prevText.textContent = lastSpeaker.text;
        prevBar.style.background = lastSpeaker.color;
        prevRow.classList.add("visible");
      } else if (lastSpeaker && lastSpeaker.id === speakerId) {
        // Mismo hablante: no mover fila previa, solo actualizarla si hay algo
        // (la dejamos como estaba)
      } else {
        prevRow.classList.remove("visible");
      }
    }

    function displayText(translated, original, speakerId, speakerColor) {
      clearTimers();

      const doShow = () => {
        promotePrev(translated, speakerId, speakerColor);

        curBar.style.background = speakerColor;
        curText.textContent = translated;
        curText.classList.remove("fading");

        if (isDual && original) {
          curOrig.textContent = original;
          curOrig.style.display = "block";
        } else {
          curOrig.style.display = "none";
        }

        curRow.classList.add("visible");
        lastSpeaker = { id: speakerId, color: speakerColor, text: translated };
        shownAt = Date.now();

        hideTimer = setTimeout(() => {
          curRow.classList.remove("visible");
          prevRow.classList.remove("visible");
          shownAt = 0;
          processQueue();
        }, HIDE_AFTER_MS);
      };

      if (curRow.classList.contains("visible")) {
        curText.classList.add("fading");
        setTimeout(doShow, 160);
      } else {
        doShow();
      }
    }

    function processQueue() {
      if (!queue.length) return;
      const elapsed = Date.now() - shownAt;
      const wait    = Math.max(0, MIN_DISPLAY_MS - elapsed);
      nextTimer = setTimeout(() => {
        const item = queue.shift();
        if (item) displayText(item.translated, item.original, item.speakerId, item.speakerColor);
        if (queue.length) processQueue();
      }, wait);
    }

    function onNewSubtitle(translated, original, speakerId, speakerColor) {
      const elapsed = Date.now() - shownAt;
      if (!curRow.classList.contains("visible") || elapsed >= MIN_DISPLAY_MS) {
        queue = [];
        displayText(translated, original, speakerId, speakerColor);
      } else {
        // Guardar solo el más reciente (descartar cola vieja)
        queue = [{ translated, original, speakerId, speakerColor }];
        if (!nextTimer) processQueue();
      }
    }

    // ── WebSocket ───────────────────────────────────────────────
    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const url   = `${proto}//${location.host}/ws?lang=${encodeURIComponent(targetLang)}&dual=${isDual ? "1" : "0"}`;
      const ws    = new WebSocket(url);

      ws.onmessage = ({ data: raw }) => {
        try {
          const data = JSON.parse(raw);
          if ((data.type === "translation" || data.type === "partial") && data.translated) {
            onNewSubtitle(
              data.translated,
              data.original || "",
              data.speaker_id   ?? 0,
              data.speaker_color ?? "#38bdf8"
            );
          } else if (data.type === "clear") {
            clearTimers();
            queue = [];
            curRow.classList.remove("visible");
            prevRow.classList.remove("visible");
          }
        } catch (_) {}
      };

      ws.onclose = () => setTimeout(connect, 2000);
    }

    connect();
  </script>
</body>
</html>
